<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2b7cdd">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="记账本">
    <title>个人记账本</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent;
            font-family: system-ui, -apple-system, "Microsoft Yahei", sans-serif; margin: 0; padding: 0; }
        body { background-color: #f5f7fa; max-width: 720px; margin: 0 auto;
               padding: 16px env(safe-area-inset-right) calc(16px + env(safe-area-inset-bottom)) env(safe-area-inset-left); }
        .card { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 4px #00000015; }
        h2, h3 { margin-bottom: 14px; color: #222; }
        .row { margin: 12px 0; }
        input, select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 8px; background:#fff; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        button { flex: 1; min-width: 90px; padding: 12px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; color: #fff; }
        .btn-add{background:#2b7cdd;} .btn-export{background:#28a745;} .btn-import{background:#9333ea;}
        .btn-filter{background:#f08c00;} .btn-clear{background:#dc3545;}
        .btn-del{ flex:none; min-width:auto; padding:6px 12px; font-size:13px; background:#dc3545; color:#fff; border-radius:6px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border: 1px solid #e8e8e8; padding: 10px 6px; text-align: center; }
        .income { color: #009944; font-weight: bold; }
        .expense { color: #dd3333; font-weight: bold; }
        .stat-item { font-size: 17px; margin: 8px 0; }
        .month-hint { font-size: 15px; color: #666; margin-top: 10px; }
        #file-input { display: none; }

        /* 分类汇总条形图 */
        .bar-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 14px; }
        .bar-name { width: 68px; flex: none; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar-track { flex: 1; height: 16px; background: #eef1f5; border-radius: 8px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 8px; transition: width .35s ease; }
        .bar-val { flex: none; text-align: right; color: #555; font-variant-numeric: tabular-nums; font-size: 13px; }
        .cate-total { margin-top: 12px; font-size: 14px; color: #888; }
        .empty-tip { color: #999; font-size: 14px; }

        /* 手机端提示 */
        .desktop-banner { display: none; background: #fff3cd; color: #7a5300; border-radius: 10px;
                          padding: 12px 14px; margin-bottom: 16px; font-size: 14px; line-height: 1.6; }
        .install-card { display: none; }
        .install-card .month-hint { margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="desktop-banner" id="desktopBanner">
        📱 本应用为手机端应用：请用手机浏览器打开，并「安装到手机桌面」后使用。电脑端仅作预览。
    </div>

    <h2>📒 个人记账本</h2>

    <!-- 安装到手机 -->
    <div class="card install-card" id="installCard">
        <h3>📲 安装到手机</h3>
        <p class="month-hint" id="installTip">把记账本安装到手机桌面，像 App 一样使用，支持离线。</p>
        <button class="btn-add" id="installBtn" onclick="installApp()">安装到手机桌面</button>
    </div>

    <!-- 添加账单 -->
    <div class="card">
        <div class="row">
            <select id="type">
                <option value="支出">支出</option>
                <option value="收入">收入</option>
            </select>
        </div>
        <div class="row"><input type="number" id="money" placeholder="输入金额" min="0" step="0.01" inputmode="decimal"></div>
        <div class="row"><input type="text" id="cate" placeholder="分类：餐饮/交通/工资"></div>
        <div class="row"><input type="text" id="remark" placeholder="备注（选填）"></div>
        <div class="btn-group">
            <button class="btn-add" onclick="addBill()">添加账单</button>
            <button class="btn-export" onclick="exportData()">导出CSV</button>
            <button class="btn-import" onclick="document.getElementById('file-input').click()">导入CSV</button>
            <button class="btn-clear" onclick="clearAll()">清空全部</button>
            <input type="file" id="file-input" accept=".csv" onchange="importData(this)">
        </div>
    </div>

    <!-- 按月筛选 -->
    <div class="card">
        <h3>🗓️ 按月份筛选</h3>
        <div class="row"><input type="month" id="monthPicker" onchange="onMonthChange(this.value)"></div>
        <div class="btn-group"><button class="btn-filter" onclick="resetMonth()">显示全部月份</button></div>
        <p class="month-hint" id="monthHint">当前：全部月份</p>
    </div>

    <!-- 收支统计 -->
    <div class="card">
        <h3>📊 收支统计</h3>
        <p class="stat-item">总收入：<span id="totalIncome" class="income">0.00</span> 元</p>
        <p class="stat-item">总支出：<span id="totalExpense" class="expense">0.00</span> 元</p>
        <p class="stat-item">结余：<span id="balance">0.00</span> 元</p>
    </div>

    <!-- 分类汇总：支出 -->
    <div class="card">
        <h3>🧾 分类汇总 · 支出</h3>
        <div id="cateExpenseBox"></div>
    </div>

    <!-- 分类汇总：收入 -->
    <div class="card">
        <h3>💰 分类汇总 · 收入</h3>
        <div id="cateIncomeBox"></div>
    </div>

    <!-- 账单列表 -->
    <div class="card">
        <h3>📋 账单列表 <span id="listCount" style="font-size:14px;color:#888;"></span></h3>
        <table>
            <thead><tr><th>时间</th><th>类型</th><th>金额</th><th>分类</th><th>操作</th></tr></thead>
            <tbody id="billList"></tbody>
        </table>
    </div>

<script>
/* ========== 基础数据层 ========== */
let currentMonth = "";

function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function pad2(n){ return String(n).padStart(2, "0"); }
function formatTime(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function getMonthKey(t){ if(!t) return ""; const m = t.match(/(\d{4})[\/\-年.](\d{1,2})/); return m ? m[1]+"-"+pad2(m[2]) : ""; }

function getBills(){
    const data = localStorage.getItem("billData");
    const list = data ? JSON.parse(data) : [];
    let changed = false;
    list.forEach(b => { if(!b.id){ b.id = genId(); changed = true; } });
    if(changed) saveBills(list);
    return list;
}
function saveBills(list){ localStorage.setItem("billData", JSON.stringify(list)); }

/* ========== 增删 ========== */
function addBill(){
    const type = document.getElementById("type").value;
    const money = Number(document.getElementById("money").value);
    const cate = document.getElementById("cate").value.trim();
    const remark = document.getElementById("remark").value.trim();
    if(!money || money <= 0){ alert("请填写有效的金额"); return; }
    const list = getBills();
    list.push({ id: genId(), time: formatTime(new Date()), type, money, cate, remark });
    saveBills(list);
    render();
    document.getElementById("money").value = "";
    document.getElementById("cate").value = "";
    document.getElementById("remark").value = "";
}

function delBill(id){
    saveBills(getBills().filter(b => b.id !== id));
    render();
}
function clearAll(){
    if(confirm("确认清空所有账单，无法恢复！")){ localStorage.removeItem("billData"); render(); }
}

/* ========== 月筛选 ========== */
function onMonthChange(v){ currentMonth = v || ""; render(); }
function resetMonth(){ currentMonth = ""; document.getElementById("monthPicker").value = ""; render(); }

/* ========== 分类汇总图表 ========== */
const BAR_COLORS = ["#2b7cdd","#28a745","#f08c00","#9333ea","#dc3545","#17a2b8","#6f42c1","#fd7e14","#20c997","#6c757d"];

function buildCateBox(boxId, items, total){
    const map = {};
    items.forEach(i => {
        const k = (i.cate && i.cate.trim()) ? i.cate.trim() : "未分类";
        map[k] = (map[k] || 0) + i.money;
    });
    const arr = Object.entries(map).sort((a, b) => b[1] - a[1]);
    const box = document.getElementById(boxId);
    if(!arr.length){ box.innerHTML = '<p class="empty-tip">暂无记录</p>'; return; }

    let html = "";
    arr.forEach(([name, val], idx) => {
        const pct = total > 0 ? (val / total * 100) : 0;
        html += `<div class="bar-row">
            <div class="bar-name" title="${name}">${name}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct.toFixed(1)}%;background:${BAR_COLORS[idx % BAR_COLORS.length]}"></div></div>
            <div class="bar-val">¥${val.toFixed(2)} · ${pct.toFixed(0)}%</div>
        </div>`;
    });
    html += `<p class="cate-total">合计 ¥${total.toFixed(2)}，共 ${arr.length} 个分类</p>`;
    box.innerHTML = html;
}

/* ========== 渲染 ========== */
function render(){
    const all = getBills();
    const list = currentMonth ? all.filter(b => getMonthKey(b.time) === currentMonth) : all;

    let html = "", income = 0, expense = 0;
    list.forEach(item => {
        if(item.type === "收入") income += item.money; else expense += item.money;
        const cls = item.type === "收入" ? "income" : "expense";
        html += `<tr>
            <td>${item.time}</td>
            <td>${item.type}</td>
            <td class="${cls}">${item.money}</td>
            <td>${item.cate || ""}</td>
            <td><button class="btn-del" onclick="delBill('${item.id}')">删除</button></td>
        </tr>`;
    });
    document.getElementById("billList").innerHTML = html || `<tr><td colspan="5" style="color:#999">暂无记录</td></tr>`;
    document.getElementById("totalIncome").innerText = income.toFixed(2);
    document.getElementById("totalExpense").innerText = expense.toFixed(2);
    document.getElementById("balance").innerText = (income - expense).toFixed(2);
    document.getElementById("monthHint").innerText = currentMonth ? "当前：" + currentMonth : "当前：全部月份";
    document.getElementById("listCount").innerText = "共 " + list.length + " 条";

    // 分类汇总（随月筛选联动）
    buildCateBox("cateExpenseBox", list.filter(i => i.type !== "收入"), expense);
    buildCateBox("cateIncomeBox", list.filter(i => i.type === "收入"), income);
}

/* ========== 导入导出 ========== */
function exportData(){
    const list = getBills();
    let txt = "id,时间,类型,金额,分类,备注\n";
    list.forEach(i => { txt += `${i.id},${i.time},${i.type},${i.money},${i.cate || ""},${i.remark || ""}\n`; });
    const blob = new Blob([txt], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (currentMonth || "全部") + "_账单.csv";
    a.click();
}

function importData(fileInput){
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
        const rows = e.target.result.split(/\r?\n/);
        const oldList = getBills();
        const oldIds = new Set(oldList.map(b => b.id));
        const newBills = [];
        let skipped = 0;
        for(let i = 1; i < rows.length; i++){
            const line = rows[i].trim();
            if(!line) continue;
            const cols = line.split(",");
            let id, time, type, money, cate, remark;
            if(cols.length >= 6){ [id, time, type, money, cate, remark] = cols; }
            else { [time, type, money, cate, remark] = cols; id = genId(); }
            if(!id) id = genId();
            if(oldIds.has(id)){ skipped++; continue; }
            newBills.push({ id, time, type, money: parseFloat(money), cate, remark: remark || "" });
            oldIds.add(id);
        }
        saveBills([...oldList, ...newBills]);
        render();
        alert(`导入完成：新增 ${newBills.length} 条，跳过重复 ${skipped} 条。`);
    };
    reader.readAsText(file, "UTF-8");
    fileInput.value = "";
}

/* ========== 手机端安装（PWA） ========== */
const UA = navigator.userAgent;
const isMobile = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(UA);

function setupMobile(){
    if(!isMobile){ document.getElementById("desktopBanner").style.display = "block"; return; }
    const card = document.getElementById("installCard");
    const isIOS = /iPhone|iPad|iPod/.test(UA);
    if(isIOS){
        card.style.display = "block";
        document.getElementById("installTip").innerText =
            "iPhone / iPad 安装方法：点底部「分享」按钮 → 选择「添加到主屏幕」→ 添加即可。";
        document.getElementById("installBtn").style.display = "none";
    } else {
        card.style.display = "block";
        document.getElementById("installTip").innerText =
            "把记账本安装到手机桌面，像 App 一样使用，支持离线。";
    }
}

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("installBtn").style.display = "block";
});

function installApp(){
    if(!deferredPrompt){ alert("请用手机浏览器打开，或点浏览器菜单里的「添加到主屏幕 / 安装应用」。"); return; }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(() => { deferredPrompt = null; });
}

if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
}
window.addEventListener("appinstalled", () => {
    document.getElementById("installTip").innerText = "✅ 已安装到手机桌面，可从桌面图标直接打开。";
    document.getElementById("installBtn").style.display = "none";
});

setupMobile();
render();
</script>
</body>
</html>
